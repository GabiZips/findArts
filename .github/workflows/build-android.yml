name: Build native ArtFinder for Android

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Test, lint and build native APK
        working-directory: android-native
        run: ./gradlew --no-daemon test lint assembleRelease

      - name: Sign APK with the stable ArtFinder key
        shell: bash
        env:
          ARTFINDER_ANDROID_KEYSTORE_BASE64: ${{ secrets.ARTFINDER_ANDROID_KEYSTORE_BASE64 }}
          ARTFINDER_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ARTFINDER_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$ARTFINDER_ANDROID_KEYSTORE_BASE64"
          test -n "$ARTFINDER_ANDROID_KEYSTORE_PASSWORD"

          unsigned="android-native/app/build/outputs/apk/release/app-release-unsigned.apk"
          aligned="$RUNNER_TEMP/ArtFinder-Android-10-16-aligned.apk"
          signed="android-native/app/build/outputs/apk/release/ArtFinder-Android-10-16.apk"
          keystore="$RUNNER_TEMP/artfinder-upload.p12"
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          trap 'rm -f "$keystore" "$aligned"' EXIT

          test -f "$unsigned"
          printf '%s' "$ARTFINDER_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          "$build_tools/zipalign" -f -p 4 "$unsigned" "$aligned"

          export APKSIGNER_KEY_PASSWORD="$ARTFINDER_ANDROID_KEYSTORE_PASSWORD"
          "$build_tools/apksigner" sign \
            --ks "$keystore" --ks-type PKCS12 --ks-key-alias artfinder \
            --ks-pass env:APKSIGNER_KEY_PASSWORD --key-pass env:APKSIGNER_KEY_PASSWORD \
            --out "$signed" "$aligned"

          certificate="$($build_tools/apksigner verify --verbose --print-certs "$signed")"
          printf '%s\n' "$certificate"
          grep -qi \
            'certificate SHA-256 digest: e8d6011c9c44b130be635ec8973184d39681d711b7b5aee1ab15e7354b408567' \
            <<< "$certificate"

      - name: Inspect native Android package
        shell: bash
        run: |
          apk="android-native/app/build/outputs/apk/release/ArtFinder-Android-10-16.apk"
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          badging="$($build_tools/aapt dump badging "$apk")"
          printf '%s\n' "$badging"
          grep -q "package: name='io.github.gabizips.artfinder' versionCode='100001' versionName='0.10.1'" <<< "$badging"
          grep -q "sdkVersion:'29'" <<< "$badging"
          grep -q "targetSdkVersion:'36'" <<< "$badging"
          listing="$(unzip -Z1 "$apk")"
          ! grep -Eq '(^|/)(\.env|user_categories\.json)$' <<< "$listing"
          "$build_tools/apksigner" verify --verbose "$apk"

      - name: Upload native Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ArtFinder-Android-native
          path: android-native/app/build/outputs/apk/release/ArtFinder-Android-10-16.apk
          if-no-files-found: error
          retention-days: 14
