name: Build experimental ArtFinder for Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Restore Android build cache
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: android-buildozer-${{ hashFiles('buildozer.spec', 'requirements.txt') }}
          restore-keys: android-buildozer-

      - name: Build debug APK
        run: |
          mkdir -p .buildozer "$HOME/.buildozer"
          docker run --rm \
            --volume "$PWD:/home/user/hostcwd" \
            --volume "$HOME/.buildozer:/home/user/.buildozer" \
            --workdir /home/user/hostcwd \
            --entrypoint /bin/bash \
            ghcr.io/kivy/buildozer:latest -lc '
              apt-get update -qq &&
              DEBIAN_FRONTEND=noninteractive apt-get install -qq --yes --no-install-recommends curl &&
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh &&
              HOME=/home/user sh /tmp/rustup-init.sh -y --profile minimal &&
              export PATH="/home/user/.cargo/bin:$PATH" &&
              exec /usr/local/bin/entrypoint.sh android debug
            '

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ArtFinder-Android-experimental
          path: bin/*.apk
          if-no-files-found: error
