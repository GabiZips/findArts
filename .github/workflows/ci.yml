name: Validate ArtFinder

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-core.lock
            requirements-ci.txt

      - name: Install application and CI dependencies
        run: |
          python -m pip install --require-hashes -r requirements-core.lock
          python -m pip install -r requirements-ci.txt

      - name: Compile Python sources
        run: python -m compileall -q app.py config.py desktop.py artfinder sources filters utils scripts tests

      - name: Run correctness lint
        run: ruff check .

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Audit Python dependencies
        run: pip-audit -r requirements-core.lock
