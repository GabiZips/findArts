name: Validate ArtFinder

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-core.lock
            requirements-ci.txt

      - name: Install application and CI dependencies
        run: |
          python -m pip install --require-hashes -r requirements-core.lock
          python -m pip install -r requirements-ci.txt

      - name: Compile Python sources
        run: python -m compileall -q app.py config.py desktop.py artfinder sources filters utils scripts tests

      - name: Run correctness lint
        run: ruff check .

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Set up Node for frontend security tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test frontend security
        run: node --test tests/frontend_security.test.js

      - name: Audit Python dependencies
        run: pip-audit -r requirements-core.lock

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Test, lint and compile Android (no signing secrets)
        working-directory: android-native
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
