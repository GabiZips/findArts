name: Build ArtFinder for Linux

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-linux.lock

      - name: Install Linux runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-linux.lock

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build Linux executable
        run: python -m PyInstaller --noconfirm --clean artfinder.spec

      - name: Create AppDir
        run: |
          mkdir -p ArtFinder.AppDir/usr/bin
          cp dist/ArtFinder ArtFinder.AppDir/usr/bin/ArtFinder
          cp packaging/linux/AppRun ArtFinder.AppDir/AppRun
          cp packaging/linux/artfinder.desktop ArtFinder.AppDir/artfinder.desktop
          cp assets/artfinder-icon.png ArtFinder.AppDir/artfinder.png
          chmod +x ArtFinder.AppDir/AppRun ArtFinder.AppDir/usr/bin/ArtFinder

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          ARCH: x86_64
        run: |
          curl --fail --location --retry 3 -o appimagetool.AppImage https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool.AppImage" | sha256sum --check --strict
          chmod +x appimagetool.AppImage
          ./appimagetool.AppImage ArtFinder.AppDir ArtFinder-Linux-x86_64.AppImage

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: ArtFinder-Linux-x86_64
          path: ArtFinder-Linux-x86_64.AppImage
          if-no-files-found: error
          retention-days: 14
