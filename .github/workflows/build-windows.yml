name: Build ArtFinder for Windows

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-windows.lock

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-windows.lock

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean artfinder.spec

      - name: Smoke-test packaged pairing
        shell: pwsh
        run: |
          $env:ARTFINDER_SMOKE_TEST = '1'
          $env:ARTFINDER_DATA_DIR = Join-Path $env:RUNNER_TEMP 'artfinder-smoke-data'
          $process = Start-Process -FilePath dist/ArtFinder.exe -PassThru -Wait -WindowStyle Hidden
          if ($process.ExitCode -ne 0) {
            throw "Packaged pairing smoke test failed with exit code $($process.ExitCode)."
          }

      - name: Verify clean package contents
        shell: pwsh
        run: |
          $contents = & pyi-archive_viewer -r -b dist/ArtFinder.exe | Out-String
          if ($contents -notmatch 'defaults[\\]+categories\.json') {
            throw 'Empty category defaults are missing from the executable.'
          }
          if ($contents -notmatch 'utils[\\.]pairing' -or $contents -notmatch 'cryptography') {
            throw 'Encrypted pairing dependencies are missing from the executable.'
          }
          if ($contents -match 'user_categories\.json|''\.env''') {
            throw 'The executable contains local user data or credentials.'
          }

      - name: Build Windows installer
        shell: pwsh
        run: |
          python scripts/verify-windows-package.py dist/ArtFinder.exe
          if ($LASTEXITCODE -ne 0) { throw 'Package verification failed.' }
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (-not (Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
          }
          $gradle = Get-Content android-native/app/build.gradle.kts -Raw
          if ($gradle -notmatch 'versionName\s*=\s*"([^"]+)"') { throw 'App version missing.' }
          $version = $Matches[1]
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid app version.' }
          $executable = (Resolve-Path dist/ArtFinder.exe).Path
          & $compiler "/DAppVersion=$version" "/DAppExecutable=$executable" packaging/windows/artfinder.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed.' }
          Copy-Item "dist/review/ArtFinder-Setup-$version.exe" dist/ArtFinder-Windows-Setup.exe

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ArtFinder-Windows-Installer
          path: dist/ArtFinder-Windows-Setup.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows portable build
        uses: actions/upload-artifact@v4
        with:
          name: ArtFinder-Windows
          path: dist/ArtFinder.exe
          if-no-files-found: error
          retention-days: 14
