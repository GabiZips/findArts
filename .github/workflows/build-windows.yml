name: Build ArtFinder for Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean artfinder.spec

      - name: Verify clean package contents
        shell: pwsh
        run: |
          $contents = & pyi-archive_viewer -l dist/ArtFinder.exe | Out-String
          if ($contents -notmatch 'defaults[\\]+categories\.json') {
            throw 'Empty category defaults are missing from the executable.'
          }
          if ($contents -match 'user_categories\.json|''\.env''') {
            throw 'The executable contains local user data or credentials.'
          }

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: ArtFinder-Windows
          path: dist/ArtFinder.exe
          if-no-files-found: error
