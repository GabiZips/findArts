name: Build ArtFinder for Windows

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust for Windows x64
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal --component rustfmt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default stable-x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc --version

      - name: Check formatting and run Rust tests
        working-directory: desktop-rust
        run: |
          cargo fmt --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --release --locked

      - name: Build and test the portable release binary
        shell: pwsh
        run: |
          cargo build --release --locked --manifest-path desktop-rust/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item desktop-rust/target/release/artfinder-desktop.exe dist/ArtFinder.exe
          $process = Start-Process -FilePath dist/ArtFinder.exe -ArgumentList '--smoke-test' -PassThru -Wait -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "Rust smoke test failed with exit code $($process.ExitCode)." }

      - name: Build Windows installer
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
          }
          $installer = ./scripts/build-windows-installer.ps1 -SkipBuild -IsccPath $compiler
          Copy-Item -LiteralPath $installer.FullName -Destination dist/ArtFinder-Windows-Setup.exe

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ArtFinder-Windows-Installer
          path: dist/ArtFinder-Windows-Setup.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows portable build
        uses: actions/upload-artifact@v4
        with:
          name: ArtFinder-Windows
          path: dist/ArtFinder.exe
          if-no-files-found: error
          retention-days: 14
