[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["build", "dist", "venv", ".buildozer"]

[tool.ruff.lint]
# Start with correctness checks that can catch runtime failures. Broader style
# cleanup can be introduced module by module without blocking current fixes.
select = ["E9", "F63", "F7", "F82"]
